// SCORE 최소/최대값 (색상 그라데이션 기준)
const scores = geojsonData.features.map(f => f.properties.SCORE);
const minS = Math.min(...scores);
const maxS = Math.max(...scores);

// [요청: 색상 그라데이션] SCORE가 낮으면 노랑, 높으면 빨강
function getColor(score) {
  const t = (score - minS) / (maxS - minS);   // 0(낮음) ~ 1(높음)
  const g = Math.round(255 * (1 - t));        // 초록값을 줄이면 노랑 -> 빨강
  return 'rgb(255,' + g + ',0)';
}

// [요청: 배경지도] 기본은 Esri 일반지도 (API 키 필요 없음, 파일로 열어도 표시됨)
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
});
// 위성사진 (선택용)
const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
});
// OpenStreetMap은 GitHub Pages 등 https로 배포하면 정상 표시됨 (로컬 파일에선 403 차단될 수 있음)
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
});

const map = L.map('map', { layers: [esri] });
L.control.layers({ 'Esri 일반지도': esri, 'Esri 위성사진': esriSat, 'OpenStreetMap': osm }, null, { position: 'topright' }).addTo(map);

// [요청: 마커 + 팝업] SCORE 값에 따라 색이 변하는 원형 마커, 클릭 시 SCORE 팝업
const pointLayer = L.geoJSON(geojsonData, {
  pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
    radius: 8,
    fillColor: getColor(feature.properties.SCORE),
    color: '#333',
    weight: 1,
    fillOpacity: 0.85
  }),
  onEachFeature: (feature, layer) => {
    layer.bindPopup('<b>적합도(SCORE)</b>: ' + feature.properties.SCORE.toFixed(3));
  }
}).addTo(map);

// [fitBounds] 지도 범위를 데이터에 자동으로 맞춤
map.fitBounds(pointLayer.getBounds(), { padding: [20, 20] });

// 범례: 색상 막대 + 최소/최대 SCORE
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<b>적합도(SCORE)</b><div class="bar"></div>' +
    '<div class="row"><span>' + minS.toFixed(2) + ' (낮음)</span><span>' + maxS.toFixed(2) + ' (높음)</span></div>';
  return div;
};
legend.addTo(map);

// ===== [추가] 적합도 필터 슬라이더 (기준값 미만 포인트는 투명 처리) =====
const filterCtl = L.control({ position: 'topright' });
filterCtl.onAdd = function () {
  const div = L.DomUtil.create('div', 'filter-box');
  div.innerHTML =
    '<b>적합도 필터</b><br>기준값 이상만 표시: <b id="thVal">' + minS.toFixed(2) + '</b>' +
    '<input id="thSlider" type="range" min="' + (Math.floor(minS * 100) / 100) + '" max="' + maxS.toFixed(2) +
    '" step="0.01" value="' + (Math.floor(minS * 100) / 100) + '">' +
    '<div id="thCount"></div>';
  L.DomEvent.disableClickPropagation(div);   // 슬라이더 조작 시 지도가 같이 움직이지 않게
  return div;
};
filterCtl.addTo(map);

// 기준값 미만 포인트는 opacity를 낮춰 투명하게, 이상이면 원래대로 복원
function applyFilter(th) {
  let shown = 0;
  pointLayer.eachLayer(layer => {
    const ok = layer.feature.properties.SCORE >= th;
    layer.setStyle({ fillOpacity: ok ? 0.85 : 0.05, opacity: ok ? 1 : 0.1 });
    if (ok) shown++;
  });
  document.getElementById('thVal').textContent = Number(th).toFixed(2);
  document.getElementById('thCount').textContent = '표시 중: ' + shown + ' / ' + scores.length + '개';
}
document.getElementById('thSlider').addEventListener('input', e => applyFilter(parseFloat(e.target.value)));
applyFilter(parseFloat(document.getElementById('thSlider').value));
</script>
